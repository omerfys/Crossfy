name: Feature request
description: Something Beamer does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: What you are trying to do, and what Beamer would need to do for it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
  - type: markdown
    attributes:
      value: To support an existing request, add a reaction to it rather than a comment.
